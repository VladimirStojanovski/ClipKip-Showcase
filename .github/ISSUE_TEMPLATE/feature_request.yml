name: Feature request
  description: Suggest an improvement or new feature for ClipKip.
  title: "[Feature]: "
  labels: ["enhancement"]
  body:
    - type: markdown
      attributes:
        value: Thanks for suggesting an improvement. Do not include license keys, payment details, email addresses, order IDs, or private account information here. For private support, email support@clipkip.com.
    - type: textarea
      id: problem
      attributes:
        label: What problem would this solve?
        description: Describe the workflow, frustration, or missing capability.
        placeholder: Example: I want to edit multiple folders without starting separate jobs.
      validations:
        required: true

    - type: textarea
      id: solution
      attributes:
        label: What would you like ClipKip to do?
        placeholder: Describe the feature or change you want.
      validations:
        required: true

    - type: dropdown
      id: area
      attributes:
        label: Area
        options:
          - Downloads
          - Browse & select
          - Library
          - Editor
          - Licensing
          - Settings
          - Installer / updates
          - Other
      validations:
        required: true

    - type: dropdown
      id: importance
      attributes:
        label: How important is this to you?
        options:
          - Nice to have
          - Important
          - Blocking my workflow
      validations:
        required: false

    - type: textarea
      id: alternatives
      attributes:
        label: Alternatives you tried
        description: Optional.
      validations:
        required: false

    - type: textarea
      id: extra
      attributes:
        label: Extra context
        description: Optional.
      validations:
        required: false
